<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111214"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MotoLog"><link rel="manifest" href="manifest.webmanifest"><title>MotoLog</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#111}.app{max-width:700px;margin:auto;padding:30px 16px}.ey{font-size:12px;font-weight:800;letter-spacing:1.5px;color:#777}h1{font-size:38px;margin:6px 0}.sub,.muted{color:#777}.card{background:white;border-radius:22px;padding:18px;margin:13px 0}.bike{display:flex;gap:14px;align-items:center}.icon{font-size:34px;background:#f2f2f4;width:64px;height:64px;border-radius:50%;display:grid;place-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#fff;border-radius:16px;padding:12px}.stat b{display:block;font-size:18px}.stat small{color:#777}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.service,.event{border-top:1px solid #eee;padding:11px 0}.service:first-child,.event:first-child{border-top:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,.btn{border:1px solid #ddd;background:#fff;border-radius:14px;padding:13px;font-weight:700}.primary{background:#111214;color:white;border-color:#111214}.link{border:0;color:#2463d4;padding:4px;background:none}dialog{border:0;border-radius:22px;width:min(92vw,500px);padding:0}dialog::backdrop{background:#0007}.modal{padding:20px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;color:#777;margin-bottom:5px}input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font:inherit}textarea{min-height:70px}.buttons{display:flex;gap:10px}.buttons>*{flex:1}@media(max-width:500px){.stats{grid-template-columns:1fr 1fr}}</style></head>
<body><main class="app"><div class="ey">MOTORCYCLE GARAGE</div><h1>MotoLog</h1><div class="sub">Mileage, service & maintenance</div>
<div class="card bike" onclick="bikeDlg.showModal()"><div class="icon">🏍️</div><div><b id="bikeName">My Motorcycle</b><div class="muted" id="bikeModel"></div><div><b id="odo">0 mi</b></div></div></div>
<div class="stats"><div class="stat">🛣️<b id="miles">0</b><small>Ride miles</small></div><div class="stat">🏍️<b id="rides">0</b><small>Rides</small></div><div class="stat">⛽<b id="fuel">$0</b><small>Fuel</small></div><div class="stat">🔧<b id="svc">0</b><small>Service</small></div></div>
<section class="card"><div class="row"><h2>Service status</h2><button class="link" onclick="intervalDlg.showModal();drawIntervals()">Customize</button></div><div id="services"></div></section>
<section class="card"><div class="row"><h2>Recent activity</h2><button class="link" onclick="historyDlg.showModal();draw()">View all</button></div><div id="recent"></div></section>
<h2>Quick actions</h2><div class="actions"><button onclick="openEntry('ride')">＋ Log ride</button><button onclick="openEntry('maintenance')">🔧 Maintenance</button><button onclick="openEntry('fuel')">⛽ Fuel</button><button onclick="bikeDlg.showModal()">🏍️ Motorcycle</button></div>
<section class="card"><h2>Data</h2><div class="buttons"><button class="primary" onclick="backup()">Export backup</button><label class="btn" style="text-align:center">Import backup<input type="file" accept=".json" onchange="restore(event)" style="display:none"></label></div></section></main>

<dialog id="entryDlg"><form class="modal" onsubmit="saveEntry(event)"><h2 id="entryTitle"></h2><input id="etype" type="hidden"><div class="field"><label>Date</label><input id="date" type="date" required></div><div id="rideF"><div class="field"><label>Miles ridden</label><input id="rideMi" type="number" min="1"></div><div class="field"><label>Notes</label><textarea id="rideNote"></textarea></div></div><div id="maintF"><div class="field"><label>Odometer</label><input id="maintOdo" type="number"></div><div class="field"><label>Service</label><input id="maintName" value="Oil change"></div><div class="field"><label>Notes / parts</label><textarea id="maintNote"></textarea></div><div class="field"><label>Cost</label><input id="maintCost" type="number" step=".01"></div></div><div id="fuelF"><div class="field"><label>Odometer</label><input id="fuelOdo" type="number"></div><div class="field"><label>Gallons</label><input id="gal" type="number" step=".001"></div><div class="field"><label>Total cost</label><input id="fuelCost" type="number" step=".01"></div></div><div class="buttons"><button type="button" onclick="entryDlg.close()">Cancel</button><button class="primary">Save</button></div></form></dialog>
<dialog id="bikeDlg"><form class="modal" onsubmit="saveBike(event)"><h2>Motorcycle</h2><div class="field"><label>Name</label><input id="bn"></div><div class="field"><label>Year</label><input id="by"></div><div class="field"><label>Model</label><input id="bm"></div><div class="field"><label>Current odometer</label><input id="bo" type="number"></div><div class="buttons"><button type="button" onclick="bikeDlg.close()">Cancel</button><button class="primary">Save</button></div></form></dialog>
<dialog id="intervalDlg"><div class="modal"><h2>Service intervals</h2><div id="intervals"></div><button onclick="addInterval()">＋ Add interval</button><div class="buttons" style="margin-top:12px"><button onclick="intervalDlg.close()">Cancel</button><button class="primary" onclick="saveIntervals()">Save</button></div></div></dialog>
<dialog id="historyDlg"><div class="modal"><div class="row"><h2>History</h2><button class="link" onclick="historyDlg.close()">Done</button></div><div id="history"></div></div></dialog>
<script>
const D={bike:{name:"My Motorcycle",year:"",model:"",odometer:0},rides:[],maintenance:[],fuel:[],intervals:[["Oil change",3000],["Primary / transmission",5000],["Air filter",10000],["Spark plugs",15000],["Brake fluid",24000]].map(x=>({name:x[0],miles:x[1]}))};let d;try{d={...D,...JSON.parse(localStorage.getItem("motolog")||"{}")}}catch(e){d=structuredClone(D)}
const $=x=>document.getElementById(x),esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function persist(){localStorage.setItem("motolog",JSON.stringify(d));draw()}
function due(i){let a=d.maintenance.filter(m=>m.service.toLowerCase()==i.name.toLowerCase()).sort((a,b)=>b.odometer-a.odometer);return (a[0]?.odometer||0)+i.miles}
function events(){return [...d.rides.map(x=>({date:x.date,t:"🛣️ Ride — "+x.miles+" mi",m:x.notes||x.date})),...d.maintenance.map(x=>({date:x.date,t:"🔧 "+x.service,m:x.odometer+" mi"+(x.cost?" • $"+Number(x.cost).toFixed(2):"")})),...d.fuel.map(x=>({date:x.date,t:"⛽ Fuel — "+Number(x.gallons).toFixed(1)+" gal",m:"$"+Number(x.cost).toFixed(2)}))].sort((a,b)=>b.date.localeCompare(a.date))}
function ev(x){return `<div class="event"><b>${esc(x.t)}</b><div class="muted">${esc(x.m)}</div></div>`}
function draw(){$("bikeName").textContent=d.bike.name;$("bikeModel").textContent=[d.bike.year,d.bike.model].filter(Boolean).join(" ");$("odo").textContent=Number(d.bike.odometer).toLocaleString()+" mi";$("miles").textContent=d.rides.reduce((s,x)=>s+Number(x.miles),0).toLocaleString();$("rides").textContent=d.rides.length;$("fuel").textContent="$"+d.fuel.reduce((s,x)=>s+Number(x.cost),0).toFixed(0);$("svc").textContent=d.maintenance.length;$("services").innerHTML=d.intervals.map(i=>{let q=due(i),r=q-d.bike.odometer;return `<div class="service row"><div><b>${esc(i.name)}</b><div class="muted">${r<=0?"Due now":r.toLocaleString()+" miles remaining"}</div></div><small>${q.toLocaleString()} mi</small></div>`}).join("");let e=events();$("recent").innerHTML=e.slice(0,5).map(ev).join("")||'<div class="muted">No activity yet.</div>';$("history").innerHTML=e.map(ev).join("")||'<div class="muted">No records yet.</div>';bn.value=d.bike.name;by.value=d.bike.year;bm.value=d.bike.model;bo.value=d.bike.odometer}
function openEntry(t){etype.value=t;entryTitle.textContent=t=="ride"?"Log Ride":t=="fuel"?"Fuel":"Maintenance";date.value=new Date().toISOString().slice(0,10);rideF.style.display=t=="ride"?"block":"none";maintF.style.display=t=="maintenance"?"block":"none";fuelF.style.display=t=="fuel"?"block":"none";maintOdo.value=fuelOdo.value=d.bike.odometer;entryDlg.showModal()}
function saveEntry(e){e.preventDefault();let t=etype.value;if(t=="ride"){let m=+rideMi.value;if(!m)return;d.rides.unshift({date:date.value,miles:m,notes:rideNote.value});d.bike.odometer+=m}else if(t=="maintenance"){let o=+maintOdo.value||d.bike.odometer;d.maintenance.unshift({date:date.value,odometer:o,service:maintName.value||"Service",notes:maintNote.value,cost:+maintCost.value||0});d.bike.odometer=Math.max(d.bike.odometer,o)}else{let o=+fuelOdo.value||d.bike.odometer;d.fuel.unshift({date:date.value,odometer:o,gallons:+gal.value||0,cost:+fuelCost.value||0});d.bike.odometer=Math.max(d.bike.odometer,o)}persist();entryDlg.close()}
function saveBike(e){e.preventDefault();d.bike={name:bn.value||"My Motorcycle",year:by.value,model:bm.value,odometer:+bo.value||0};persist();bikeDlg.close()}
function drawIntervals(){$("intervals").innerHTML=d.intervals.map((i,n)=>`<div class="row" style="margin:8px 0"><input data-n="${n}" data-k="name" value="${esc(i.name)}"><input data-n="${n}" data-k="miles" type="number" value="${i.miles}" style="width:110px"><button onclick="d.intervals.splice(${n},1);drawIntervals()">×</button></div>`).join("")}
function addInterval(){d.intervals.push({name:"New service",miles:3000});drawIntervals()}function saveIntervals(){document.querySelectorAll("#intervals input").forEach(x=>d.intervals[+x.dataset.n][x.dataset.k]=x.dataset.k=="miles"?+x.value:x.value);persist();intervalDlg.close()}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.download="MotoLog-backup.json";a.click()}
function restore(e){let r=new FileReader();r.onload=()=>{try{d={...D,...JSON.parse(r.result)};persist();alert("Backup imported.")}catch(x){alert("Invalid backup.")}};if(e.target.files[0])r.readAsText(e.target.files[0])}
draw();if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js"));
</script></body></html>
